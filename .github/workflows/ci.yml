name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Tests (integridad de datos)
        run: npm test
      - name: Build (vite)
        run: npm run build
